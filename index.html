<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Los Discos del Homie — Portafolio de contenido sobre rap. Aquí solo se habla de Rap." />
    <meta name="author" content="Los Discos del Homie" />
    <title>Los Discos del Homie · Portafolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Ultra (display, un peso) + Archivo variable: ancho 75–125 y peso 400–800. -->
    <link href="https://fonts.googleapis.com/css2?family=Ultra&family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet" />
    <!-- SPA GitHub Pages: decodifica la redirección de 404.html
         (/?/top-20&perf=dos
          → /top-20?perf=dos).
         Debe ir antes del <script type="module">, que es diferido. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
